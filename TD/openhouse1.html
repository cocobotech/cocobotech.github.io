<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open House List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #F5EDD3;
    --gold-dark: #8B6914;
    --ink: #1A1611;
    --ink-mid: #3D3528;
    --ink-soft: #7A6E5F;
    --cream: #FDFAF4;
    --cream-2: #F5F0E8;
    --cream-3: #EDE6D8;
    --white: #FFFFFF;
    --border: rgba(201,168,76,0.25);
    --border-strong: rgba(201,168,76,0.5);
    --shadow: 0 4px 24px rgba(26,22,17,0.08);
    --shadow-hover: 0 8px 40px rgba(26,22,17,0.14);
    --radius: 12px;
  }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  .page-header {
    background: var(--ink);
    padding: 14px 48px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .header-date {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(253,250,244,0.45);
  }
  .header-date strong {
    color: var(--gold);
    font-weight: 500;
  }

  /* ── Controls ── */
  .controls-bar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 16px 48px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(26,22,17,0.06);
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 280px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    height: 38px;
    padding: 0 12px 0 38px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--cream-2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .search-input:focus { border-color: var(--gold); background: var(--white); }
  .search-input::placeholder { color: var(--ink-soft); }

  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-lbl {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  select.filter-sel {
    height: 38px;
    padding: 0 28px 0 12px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--cream-2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237A6E5F' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    transition: border-color 0.2s;
  }
  select.filter-sel:focus { border-color: var(--gold); }

  .ctrl-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    flex-shrink: 0;
  }

  .sort-btn {
    height: 38px;
    padding: 0 16px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .sort-btn:hover { border-color: var(--gold); color: var(--gold-dark); background: var(--gold-light); }
  .sort-btn.active { border-color: var(--gold); color: var(--gold-dark); background: var(--gold-light); }
  .sort-btn .sort-icon { font-size: 10px; }

  .results-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .results-count strong { color: var(--gold-dark); font-weight: 500; }

  /* ── Table wrapper ── */
  .table-wrap {
    padding: 32px 48px 48px;
  }

  /* ── Table ── */
  .oh-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .oh-table thead tr {
    background: var(--ink);
  }
  .oh-table thead th {
    padding: 14px 14px;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(253,250,244,0.55);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .oh-table thead th:hover { color: var(--gold); }
  .oh-table thead th.sorted { color: var(--gold); }
  .oh-table thead th .th-inner {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sort-arrows { display: flex; flex-direction: column; gap: 1px; opacity: 0.4; }
  .sort-arrows.asc .arr-up,
  .sort-arrows.desc .arr-dn { opacity: 1; color: var(--gold); }
  .arr-up, .arr-dn { font-size: 8px; line-height: 1; }

  .oh-table tbody tr {
    transition: background 0.15s;
    border-bottom: 1px solid var(--cream-3);
  }
  .oh-table tbody tr:last-child { border-bottom: none; }
  .oh-table tbody tr:hover { background: var(--gold-light); }
  .oh-table tbody tr:nth-child(even) { background: var(--cream-2); }
  .oh-table tbody tr:nth-child(even):hover { background: var(--gold-light); }

  .oh-table td {
    padding: 14px 14px;
    vertical-align: middle;
    font-size: 15px;
    color: var(--ink-mid);
    border-right: 1px solid transparent;
  }

  /* Address cell */
  .addr-link {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    display: block;
    line-height: 1.4;
    transition: color 0.2s;
  }
  .addr-link:hover { color: var(--gold-dark); text-decoration: underline; }
  .addr-sub {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .price-plain {
    font-size: 16px;
    font-weight: 700;
    color: #1a5fb4;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

  /* School badge */
  .school-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #EEF5E8;
    color: #3B6010;
    font-size: 13px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .school-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5A9020;
    flex-shrink: 0;
  }

  /* Beds/baths */
  .room-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .room-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
  }
  .room-icon { font-size: 14px; color: var(--gold-dark); }
  .room-val { font-weight: 500; color: var(--ink); }
  .room-lbl { color: var(--ink-soft); font-size: 12px; }

  /* Size */
  .size-val {
    font-weight: 500;
    color: var(--ink);
    font-size: 15px;
  }
  .size-unit { font-size: 12px; color: var(--ink-soft); }

  /* Thumbnails */
  .thumbs-wrap {
    display: flex;
    gap: 5px;
  }
  .thumb-wrap {
    position: relative;
    display: inline-block;
  }
  .thumb {
    width: 64px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    transition: border-color 0.2s, transform 0.2s;
    cursor: zoom-in;
    display: block;
  }
  .thumb:hover { border-color: var(--gold); transform: scale(1.05); }

  /* Hover preview */
  .img-preview {
    display: none;
    position: fixed;
    z-index: 8888;
    pointer-events: none;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--gold);
    box-shadow: 0 12px 48px rgba(26,22,17,0.35);
    transition: opacity 0.15s;
    opacity: 0;
  }
  .img-preview.visible { display: block; opacity: 1; }
  .img-preview img {
    width: 320px;
    height: 240px;
    object-fit: cover;
    display: block;
  }

  /* Notes */
  .notes-cell {
    max-width: 180px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .notes-tag {
    display: inline-block;
    background: #F5EDD3;
    color: var(--gold-dark);
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .notes-tag.hot         { background: #FEEAEA; color: #A03030; }
  .notes-tag.new         { background: #EAF5EA; color: #2A6E2A; }
  .notes-tag.price_drop  { background: #FFF0F0; color: #C0392B; }
  .notes-tag.open_house  { background: #E8F0FE; color: #1a5fb4; }
  .notes-tag.just_listed { background: #FFF8E6; color: #8B5E00; }

  /* Status badge */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-active   { background: #E8F4FD; color: #1a5fb4; }
  .status-active   .status-dot { background: #1a5fb4; }
  .status-pending  { background: #FFF8E6; color: #8B5E00; }
  .status-pending  .status-dot { background: #E8A000; }
  .status-sold     { background: #FDEAEA; color: #A03030; }
  .status-sold     .status-dot { background: #D03030; }
  .status-contingent { background: #F0EAFD; color: #5B2D9E; }
  .status-contingent .status-dot { background: #7C3AED; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--ink-soft);
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
  .empty-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--ink); margin-bottom: 8px; }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,8,5,0.88);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 80vh;
    border-radius: 10px;
    border: 2px solid var(--gold);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .lb-close {
    position: absolute;
    top: 24px; right: 28px;
    color: rgba(255,255,255,0.7);
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
  }
  .lb-close:hover { color: var(--gold); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream-2); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

  @media (max-width: 900px) {
    .page-header, .controls-bar, .table-wrap { padding-left: 20px; padding-right: 20px; }
    .table-wrap { overflow-x: auto; }
    .oh-table { min-width: 1200px; }
  }
</style>
</head>

</div>

<!-- Lightbox -->

</div>

let sortCol = null, sortDir = 1;
let filtered = [...DATA];

function fmtPrice(n) {
  if (n >= 1000000) return '$' + (n/1000000).toFixed(n % 1000000 === 0 ? 0 : 2) + 'M';
  return '$' + n.toLocaleString();
}
function fmtNum(n) { return n.toLocaleString(); }

function updateStats(arr) {
  document.getElementById('results-count').innerHTML = `<strong>${arr.length}</strong> result${arr.length !== 1 ? 's' : ''}`;
}

function setDate() {
  const d = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const str = d.toLocaleDateString('en-US', opts);
  document.getElementById('header-date').innerHTML = `Open House &nbsp;·&nbsp; <strong>${str}</strong>`;
}

function populateDynamicFilters() {
  function fill(id, key) {
    const sel = document.getElementById(id);
    const vals = [...new Set(DATA.map(d => d[key]))].sort();
    vals.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
  }
  fill('filter-school', 'school');
  fill('filter-city', 'city');
  fill('filter-zip', 'zip');
}

function applyFilters() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const minBeds = parseInt(document.getElementById('filter-beds').value) || 0;
  const maxPriceM = parseFloat(document.getElementById('filter-price').value) || Infinity;
  const school = document.getElementById('filter-school').value;
  const city = document.getElementById('filter-city').value;
  const zip = document.getElementById('filter-zip').value;
  const status = document.getElementById('filter-status').value;

  filtered = DATA.filter(d => {
    if (minBeds && d.beds < minBeds) return false;
    if (d.price > maxPriceM * 1000000) return false;
    if (school && d.school !== school) return false;
    if (city && d.city !== city) return false;
    if (zip && d.zip !== zip) return false;
    if (status && d.status !== status) return false;
    if (search) {
      const hay = (d.address + d.school + d.notes + d.city + d.zip + d.status).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  if (sortCol) applySort(false);
  render();
}

function applySort(toggle = true) {
  if (toggle) {
    sortDir = (sortCol === arguments[1]) ? sortDir * -1 : 1;
    sortCol = arguments[1] || sortCol;
  }
  filtered.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'string') va = va.toLowerCase(), vb = vb.toLowerCase();
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });
}

const TAG_MAP = {
  hot:         { emoji: '🔥', label: 'Hot' },
  new:         { emoji: '✨', label: 'New' },
  price_drop:  { emoji: '📉', label: 'Price Drop' },
  open_house:  { emoji: '🏡', label: 'Open House' },
  just_listed: { emoji: '⭐', label: 'Just Listed' },
};

function render() {
  const tbody = document.getElementById('table-body');
  const emptyState = document.getElementById('empty-state');
  const table = document.getElementById('oh-table');
  tbody.innerHTML = '';

  document.querySelectorAll('.sort-arrows').forEach(el => {
    el.classList.remove('asc','desc');
    el.closest('th').classList.remove('sorted');
  });
  if (sortCol) {
    const sa = document.getElementById('sa-' + sortCol);
    if (sa) {
      sa.classList.add(sortDir === 1 ? 'asc' : 'desc');
      sa.closest('th').classList.add('sorted');
    }
  }

  document.getElementById('results-count').innerHTML = `<strong>${filtered.length}</strong> result${filtered.length !== 1 ? 's' : ''}`;
  updateStats(filtered);

  if (filtered.length === 0) {
    table.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  table.style.display = 'table';
  emptyState.style.display = 'none';

  filtered.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <a class="addr-link" href="${d.url}" target="_blank">${d.address}</a>
        <div class="addr-sub">${d.addressShort}</div>
      </td>
      <td>
        <div class="room-info">
          <div class="room-row">
            <span class="room-icon">🛏</span>
            <span class="room-val">${d.beds}</span>
            <span class="room-lbl">bed</span>
          </div>
          <div class="room-row">
            <span class="room-icon">🚿</span>
            <span class="room-val">${d.baths}</span>
            <span class="room-lbl">bath</span>
          </div>
        </div>
      </td>
      <td><span class="size-val">${fmtNum(d.size)}</span><br><span class="size-unit">sq ft</span></td>
      <td><span class="size-val">${fmtNum(d.lot)}</span><br><span class="size-unit">sq ft</span></td>
      <td><span class="price-plain">${fmtPrice(d.price)}</span></td>
      <td><span class="school-badge"><span class="school-dot"></span>${d.school}</span></td>
      <td style="font-size:14px;font-weight:500;color:var(--ink)">${d.city}</td>
      <td style="font-size:14px;color:var(--ink-soft);font-family:monospace;letter-spacing:0.04em">${d.zip}</td>
      <td><span class="status-badge status-${d.status.toLowerCase()}""><span class="status-dot"></span>${d.status}</span></td>
      <td>
        <div class="thumbs-wrap">
          <div class="thumb-wrap"><img class="thumb" src="${d.img1}" alt="Photo 1"></div>
          <div class="thumb-wrap"><img class="thumb" src="${d.img2}" alt="Photo 2"></div>
        </div>
      </td>
      <td class="notes-cell">
        ${(() => {
          const tags = Array.isArray(d.tag) ? d.tag : (d.tag ? [d.tag] : []);
          const tagHTML = tags.map(t => {
            const info = TAG_MAP[t] || { emoji: '', label: t };
            return `<span class="notes-tag ${t}">${info.emoji} ${info.label}</span>`;
          }).join(' ');
          return tagHTML ? tagHTML + '<br>' : '';
        })()}
        ${d.notes}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// Sort on header click
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    sortDir = (sortCol === col) ? sortDir * -1 : 1;
    sortCol = col;
    applySort(false);
    render();
  });
});

// Filter events
['search-input','filter-beds','filter-price','filter-school','filter-city','filter-zip','filter-status'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('change', applyFilters);
});

// Lightbox
function openLb(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lb-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// Hover preview
const preview = document.getElementById('img-preview');
const previewImg = document.getElementById('preview-img');
let hideTimer = null;

document.addEventListener('mouseover', e => {
  const thumb = e.target.closest('.thumb');
  if (!thumb) return;
  clearTimeout(hideTimer);
  previewImg.src = thumb.src;
  preview.classList.add('visible');
  positionPreview(e);
});

document.addEventListener('mousemove', e => {
  if (!preview.classList.contains('visible')) return;
  if (!e.target.closest('.thumb')) return;
  positionPreview(e);
});

document.addEventListener('mouseout', e => {
  const thumb = e.target.closest('.thumb');
  if (!thumb) return;
  hideTimer = setTimeout(() => preview.classList.remove('visible'), 80);
});

document.addEventListener('click', e => {
  const thumb = e.target.closest('.thumb');
  if (!thumb) return;
  preview.classList.remove('visible');
  openLb(thumb.src);
});

function positionPreview(e) {
  const pw = 324, ph = 244;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + pw > vw - 8) x = e.clientX - pw - 16;
  if (y + ph > vh - 8) y = e.clientY - ph - 16;
  preview.style.left = x + 'px';
  preview.style.top  = y + 'px';
}

populateDynamicFilters();
setDate();
render();
updateStats(DATA);
</script>
</body>
